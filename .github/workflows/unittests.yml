name: unittests

on:
  # Make sure that settings are set to require permission
  # to run workflows by external contributors!
  pull_request:
    paths-ignore:
      - 'docs/**'
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review]
  
  push:
    paths-ignore:
      - 'docs/**'
    branches: ["main"]

# Cancel previous CI builds when a new push occurs to the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unittests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t dynamatic-image . --build-arg UID=$(id -u) --build-arg GID=$(id -g)

      - name: build
        run: |
          docker run -u $(id -u):$(id -g) \
            -v "$(pwd):/home/ubuntu/dynamatic" \
            -w "/home/ubuntu/dynamatic" \
            dynamatic-image \
            /bin/bash build.sh --release --use-prebuilt-llvm --enable-abc --enable-cbc --force

      - name: check-dynamatic
        run: |
          docker run -u $(id -u):$(id -g) \
            -v "$(pwd):/home/ubuntu/dynamatic" \
            -w "/home/ubuntu/dynamatic/build" \
            dynamatic-image \
            ninja check-dynamatic

      - name: check-constraint-programming-library
        run: |
          docker run -u $(id -u):$(id -g) \
            -v "$(pwd):/home/ubuntu/dynamatic" \
            -w "/home/ubuntu/dynamatic/build" \
            dynamatic-image \
            ninja run-constraint-programming-test

