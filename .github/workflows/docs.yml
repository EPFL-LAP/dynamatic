name: docs

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:


# Allow only one concurrent run, preventing conflicts during deployment.
# This is technically not needed for pull_request runs.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build docs
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install mdbook
        env:
          MDBOOK_HASH: "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7"
        run: |
          mkdir -p ~/bin
          curl -sSL -o /tmp/mdbook.tar.gz https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz
          echo "$MDBOOK_HASH  /tmp/mdbook.tar.gz" | sha256sum --check --status || { echo "mdBook hash mismatch!"; exit 1; }
          tar -xz -f /tmp/mdbook.tar.gz --directory="$HOME/bin"
          chmod +x ~/bin/mdbook

      - name: Install mdbook-linkcheck2
        env:
          MDBOOK_LINKCHECK2_HASH: "17753132aaf80cf59ec109d9b776bd5cf7a75edd5cfa7f08dffb35cf22b6d21d"
        run: |
          mkdir -p ~/bin
          curl -sSL -o /tmp/mdbook-linkcheck2.tar.gz https://github.com/marxin/mdbook-linkcheck2/releases/download/v0.13.0/mdbook-linkcheck2-x86_64-unknown-linux-gnu.tar.gz
          echo "$MDBOOK_LINKCHECK2_HASH  /tmp/mdbook-linkcheck2.tar.gz" | sha256sum --check --status || { echo "mdbook-linkcheck2 hash mismatch!"; exit 1; }
          tar -xz -f /tmp/mdbook-linkcheck2.tar.gz --directory="$HOME/bin"
          chmod +x $HOME/bin/mdbook-linkcheck2

      - name: Build documentation
        run: |
          PATH=$PATH:$HOME/bin mdbook build

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{github.workspace}}/build/mdbook/html/

  # Deploy to github pages (push only)
  docs-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.event_name == 'push'
    needs: ["docs"]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
