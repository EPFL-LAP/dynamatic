[book]
title = "Dynamatic"
authors = ["Dynamatic Authors"]
language = "en"
src = "docs/"

[build]
build-dir = "build/mdbook"
create-missing = false

[output.html]
smart-punctuation = true
mathjax-support = true
site-url = "https://epfl-lap.github.io/dynamatic"
git-repository-url = "https://github.com/EPFL-LAP/dynamatic"
edit-url-template = "https://github.com/EPFL-LAP/dynamatic/edit/main/{path}"

[output.html.search]
limit-results = 40
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 2

[output.linkcheck2]
follow-web-links = false
optional = true
# mdbook's native alert syntax (`> [!NOTE]`) is reported as an incomplete
# link, and there is currently no way to exclude those. Broken links are
# still reported as errors.
warning-policy = "ignore"
exclude = [
    # Ignore links with anchors - not supported..
    '''[^:\s]+\.md:[^:\s]+''',
    '''[^:\s]+\.md#[^:\s]+''',
]
